version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    depends_on:
      - gateway

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./gateway/.env
    depends_on:
      - agent-engine

  agent-engine:
    build:
      context: ./agent-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./agent-engine/.env
